name: Publish

# Publishes to npm when a GitHub release is published. The release tag says what
# is published, and scripts/resolve-release.ts checks it against package.json:
#
#   v0.15.0           the core package at the repository root
#   rabbitmq-v0.1.0   packages/rabbitmq
#
# Publish the core first: every package lists it as a peer dependency, and the
# check below refuses a package whose peer range the core at this commit does
# not satisfy. See docs/releasing.md.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Work out what this release publishes
        id: target
        run: bun scripts/resolve-release.ts "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run build:packages
      - name: Check the tarballs
        run: bun scripts/check-pack.ts
      # A version with a prerelease part (1.0.0-rc.1) goes under `next`, never `latest`.
      - name: Publish
        working-directory: ${{ steps.target.outputs.dir }}
        run: npm publish --provenance --access public --tag "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ steps.target.outputs.npm_tag }}
